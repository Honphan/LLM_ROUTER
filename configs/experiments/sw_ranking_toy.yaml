# SW ranking on synthetic data: offline smoke test of the router.
include:
  - ../embeddings/hashing.yaml
  - ../models/toy.yaml

name: sw_ranking_toy
seed: 0
output_dir: experiments

data:
  sources:
    - path: data/processed/toy_battles.parquet
      weight: 1.0
  min_prompt_chars: 16
  n_tiers: 10
  calibration_fraction: 0.1
  model_aliases: {}
  toy:
    battles_path: data/processed/toy_battles.parquet
    n_battles: 2000
    n_benchmark: 300

router:
  name: sw_ranking
  params:
    gamma: 10.0
    normalize_by_max: true

eval:
  benchmark_name: toy
  benchmark_path: data/processed/bench_toy.parquet
  random_seeds: 20
  contamination_threshold: 0.95
