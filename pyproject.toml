[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouter"
version = "0.1.0"
description = "Route each query to a strong or a weak LLM (RouteLLM reproduction and extensions)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.4"]
openai = ["openai>=1.30"]
hf = ["sentence-transformers>=3.0"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than 10 seconds or needs real data",
    "network: calls the network or a paid API",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["third_party", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
